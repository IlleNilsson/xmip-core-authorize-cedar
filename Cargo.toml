# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-authorize-cedar"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-authorize-cedar"
description = "Authorization by a Cedar policy set evaluated with the Cedar engine: the identity is the principal, the attempt's action and artifact the action and the resource, the facts the context; an explicit forbid is a denial, no matching policy no opinion. A xmip-core-authorize technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The facts it judges are context's and the layer it
# answers for is core's.
authorize = { package = "xmip-core-authorize", git = "https://github.com/IlleNilsson/xmip-core-authorize", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

# The Cedar engine itself: the language, its parser and its evaluator are the
# whole of what this technology is, and writing a second one would be writing
# a different language. serde_json is how the engine takes a context.
cedar-policy = "4"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
